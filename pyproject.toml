[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d2c"
version = "0.1.0"
description = "MCP-Server zur Umwandlung technischer 2D-Zeichnungen in geprüfte STEP-Modelle"
requires-python = ">=3.12,<3.13"
dependencies = ["cadquery==2.8.0", "claude-agent-sdk==0.2.168", "mcp==2.3.0", "pydantic>=2,<3", "pymupdf==1.28.2"]

[project.optional-dependencies]
dev = ["pytest==8.*"]

# Explicit package list: the repo root also holds data/, docs/, run/ ... and
# flat-layout auto-discovery would count them as top-level packages.
[tool.setuptools]
packages = ["d2c"]

[tool.setuptools.package-data]
d2c = ["instructions.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["bct: benötigt die BCT-Beispieldaten unter /app/data"]
