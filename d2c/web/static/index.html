<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drawing2CAD</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/vendor/model-viewer.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <h1>Drawing2CAD</h1>
    <form id="upload" class="upload">
      <label>Zeichnung (PDF)<input type="file" name="pdf" accept="application/pdf" required></label>
      <label>Teilname<input type="text" name="part" pattern="(?:[\p{L}\p{N}_\-]|[AaOoUu]\u0308)+" placeholder="halterung_1" required></label>
      <label>Modell (optional)<input type="text" name="model" placeholder="Servervorgabe"></label>
      <button type="submit">Agenten starten</button>
    </form>
    <pre id="log" class="log" aria-live="polite">Noch kein Lauf. Lade eine Zeichnung hoch, um hier die Werkzeugaufrufe zu verfolgen.</pre>
  </header>
  <main class="layout">
    <nav class="parts" aria-label="Teile">
      <h2>Teile</h2>
      <ul id="parts"></ul>
    </nav>
    <section id="detail" class="detail" aria-live="polite"></section>
  </main>
</body>
</html>
