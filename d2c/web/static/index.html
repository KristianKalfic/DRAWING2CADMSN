<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drawing2CAD</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/vendor/model-viewer.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body class="loading">
  <div class="sheet">
    <aside class="bom" aria-label="Teile und Hochladen">
      <div class="brand">
        <p class="wordmark" aria-label="Drawing2CAD">Drawing<span>2CAD</span></p>
        <button type="button" id="new-run" class="btn btn-primary">Neuer Lauf</button>
      </div>
      <h2 class="bom-head">Teile <span id="parts-count" class="count"></span></h2>
      <div class="bom-scroll">
        <ul id="parts" role="listbox" aria-label="Teile"></ul>
        <div id="parts-state" class="box" hidden></div>
      </div>
      <form id="upload" class="dropzone" novalidate>
        <p id="dz-title" class="dz-title">Zeichnung (PDF, PNG, JPG) hier ablegen</p>
        <p class="dz-hint">Bis 20 MB</p>
        <input type="file" id="file" name="pdf" accept=".pdf,.png,.jpg,.jpeg" aria-label="Zeichnungsdatei" aria-describedby="file-error">
        <p id="file-error" class="field-error" role="alert"></p>
        <label for="part">Teilname</label>
        <input type="text" id="part" name="part" pattern="(?:[\p{L}\p{N}_\-]|[AaOoUu]\u0308)+" autocomplete="off" spellcheck="false" aria-describedby="part-error">
        <p id="part-error" class="field-error" role="alert"></p>
        <label for="model">Modell</label>
        <select id="model" name="model" aria-describedby="model-error">
          <option value="">Standard des Agenten</option>
        </select>
        <p id="model-error" class="field-error" role="alert"></p>
        <button type="submit" id="start" class="btn btn-secondary">STEP erstellen</button>
        <p id="run-notice" class="notice" role="alert"></p>
      </form>
    </aside>

    <header class="titleblock" id="titleblock">
      <div class="cell cell-title">
        <span class="label">Benennung</span>
        <h1 class="title" id="tb-title"></h1>
        <span class="bar" aria-hidden="true"></span>
      </div>
      <div class="cell">
        <span class="label">Zeichnung</span>
        <span class="value mono-value" id="tb-drawing"></span>
        <span class="sub" id="tb-page"></span>
      </div>
      <div class="cell">
        <span class="label">Maßstab</span>
        <span class="value" id="tb-scale"></span>
      </div>
      <div class="cell">
        <span class="label">Toleranz</span>
        <span class="value" id="tb-tolerance"></span>
      </div>
      <div class="cell">
        <span class="label">Status</span>
        <div class="status" id="tb-status"></div>
      </div>
    </header>

    <main class="main" id="main">
      <section class="drawing" id="drawing" aria-label="Zeichnung"></section>
      <section class="view3d" id="view3d" aria-label="3D-Modell">
        <div class="floor" aria-hidden="true"></div>
        <model-viewer id="viewer" camera-controls disable-tap loading="eager" interaction-prompt="none" interpolation-decay="140" environment-image="neutral" tone-mapping="commerce" shadow-intensity="0" exposure="1" field-of-view="14deg" hidden></model-viewer>
        <p class="view-label" aria-hidden="true">3D-Modell</p>
        <p class="view-hint" id="view-hint">Das 3D-Modell erscheint nach dem Export, mit Farben.</p>
        <div class="view-buttons" id="view-buttons" role="group" aria-label="Kameraansicht" hidden></div>
        <a id="step-link" class="ghost step-link" hidden>STEP herunterladen</a>
      </section>
      <div class="tabs" id="tabs" role="tablist" aria-label="Teiledetails"></div>
      <div class="panel" id="panel" role="tabpanel" tabindex="-1"></div>
    </main>
  </div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <marker id="dim-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
        <path d="M0 0.5 8 4 0 7.5" fill="none" stroke="#272727" stroke-width="1.4"/>
      </marker>
    </defs>
  </svg>
  <p id="announce" class="sr-only" aria-live="polite"></p>
  <noscript><p class="noscript">Drawing2CAD braucht JavaScript, um die Ergebnisse zu zeigen.</p></noscript>
</body>
</html>
