<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drawing2CAD</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/vendor/model-viewer.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <h1>Drawing2CAD</h1>
    <form id="upload" class="upload">
      <label>Drawing (PDF)<input type="file" name="pdf" accept="application/pdf" required></label>
      <label>Part name<input type="text" name="part" pattern="[\w\-]+" placeholder="bracket_1" required></label>
      <label>Model (optional)<input type="text" name="model" placeholder="server default"></label>
      <button type="submit">Run agent</button>
    </form>
    <pre id="log" class="log" aria-live="polite">No run yet. Upload a drawing to watch the tool calls here.</pre>
  </header>
  <main class="layout">
    <nav class="parts" aria-label="Parts">
      <h2>Parts</h2>
      <ul id="parts"></ul>
    </nav>
    <section id="detail" class="detail" aria-live="polite"></section>
  </main>
</body>
</html>
