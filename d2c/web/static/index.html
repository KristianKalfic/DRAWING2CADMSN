<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drawing2CAD</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/vendor/model-viewer.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body class="loading">
  <div class="sheet">
    <aside class="bom" aria-label="Parts and upload">
      <div class="brand">
        <p class="wordmark" aria-label="Drawing2CAD">Drawing<span>2CAD</span></p>
        <button type="button" id="new-run" class="btn btn-primary">New run</button>
      </div>
      <h2 class="bom-head">Parts <span id="parts-count" class="count"></span></h2>
      <div class="bom-scroll">
        <ul id="parts" role="listbox" aria-label="Parts"></ul>
        <div id="parts-state" class="box" hidden></div>
      </div>
      <form id="upload" class="dropzone" novalidate>
        <p id="dz-title" class="dz-title">Drop a drawing (PDF, PNG, JPG)</p>
        <input type="file" id="file" name="pdf" accept=".pdf,.png,.jpg,.jpeg" aria-label="Drawing file" aria-describedby="file-error">
        <p id="file-error" class="field-error" role="alert"></p>
        <label for="part">Part name</label>
        <input type="text" id="part" name="part" pattern="[\w\-]+" autocomplete="off" spellcheck="false" aria-describedby="part-error">
        <p id="part-error" class="field-error" role="alert"></p>
        <label for="model">Model <span class="optional">(optional)</span></label>
        <input type="text" id="model" name="model" autocomplete="off" spellcheck="false" aria-describedby="model-error">
        <p id="model-error" class="field-error" role="alert"></p>
        <button type="submit" id="start" class="btn btn-secondary">Start run</button>
        <p id="run-notice" class="notice" role="alert"></p>
      </form>
    </aside>

    <header class="titleblock" id="titleblock">
      <div class="cell cell-title">
        <span class="label">Title</span>
        <h1 class="title" id="tb-title"></h1>
        <span class="bar" aria-hidden="true"></span>
      </div>
      <div class="cell">
        <span class="label">Drawing</span>
        <span class="value mono-value" id="tb-drawing"></span>
        <span class="sub" id="tb-page"></span>
      </div>
      <div class="cell">
        <span class="label">Scale</span>
        <span class="value" id="tb-scale"></span>
      </div>
      <div class="cell">
        <span class="label">Tolerance</span>
        <span class="value" id="tb-tolerance"></span>
      </div>
      <div class="cell">
        <span class="label">Status</span>
        <div class="status" id="tb-status"></div>
      </div>
    </header>

    <main class="main" id="main">
      <section class="drawing" id="drawing" aria-label="Drawing"></section>
      <section class="view3d" id="view3d" aria-label="3D model">
        <div class="floor" aria-hidden="true"></div>
        <model-viewer id="viewer" camera-controls disable-tap loading="eager" interaction-prompt="none" interpolation-decay="140" environment-image="neutral" tone-mapping="commerce" shadow-intensity="0" exposure="1" field-of-view="14deg" hidden></model-viewer>
        <p class="view-label" aria-hidden="true">3D model</p>
        <p class="view-hint" id="view-hint">3D model appears after export with colors.</p>
        <div class="view-buttons" id="view-buttons" role="group" aria-label="Camera view" hidden></div>
      </section>
      <div class="tabs" id="tabs" role="tablist" aria-label="Part details"></div>
      <div class="panel" id="panel" role="tabpanel" tabindex="-1"></div>
    </main>
  </div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <marker id="dim-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
        <path d="M0 0.5 8 4 0 7.5" fill="none" stroke="#272727" stroke-width="1.4"/>
      </marker>
    </defs>
  </svg>
  <p id="announce" class="sr-only" aria-live="polite"></p>
  <noscript><p class="noscript">Drawing2CAD needs JavaScript to show the results.</p></noscript>
</body>
</html>
